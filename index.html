<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPECIAL SYSTEM CHECK</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b0f;color:#e9eef5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scan{position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 49%,rgba(255,255,255,.025) 50%,transparent 51%);background-size:100% 5px}
.card{width:min(92%,650px);padding:34px;background:#10151b;border:1px solid #29313b;border-radius:18px;box-shadow:0 25px 80px #000b;text-align:center;position:relative;z-index:2}
.badge{font-size:12px;letter-spacing:3px;color:#7e8a98}
h1{font-size:27px;margin:14px 0 8px}
.desc{color:#aeb8c4;line-height:1.7}
.bar{height:8px;background:#252c34;border-radius:99px;margin:28px 0 10px;overflow:hidden}
.fill{height:100%;width:0;background:#8aa4bd;transition:width .08s}
.status{height:24px;color:#aeb8c4;font-size:14px}
.hidden{display:none}
.result-icon{font-size:62px}
.result h2{font-size:42px;margin:10px 0}
.result .name{font-size:24px;font-weight:700;margin:12px}
.result p{font-size:18px;line-height:1.9;color:#d9e0e7}
.small{font-size:11px;color:#697583;margin-top:24px}
.confetti{position:fixed;top:-20px;width:9px;height:16px;z-index:5;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="scan"></div>

<div class="card" id="check">
  <div class="badge">SPECIAL SYSTEM CHECK</div>
  <h1>特別診断を開始します</h1>
  <div class="desc">
    Kazutaka Anzai さんに関する<br>
    本日の重要事項を確認しています。
  </div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">システムを準備しています...</div>
</div>

<div class="card result hidden" id="result">
  <div class="result-icon">⚠️</div>
  <div class="badge">IMPORTANT RESULT</div>
  <h2>重大な情報を検出</h2>
  <div class="name">Kazutaka Anzai</div>
  <p>
    本日の診断結果から、<br>
    <strong>あなたは本日、盛大に祝われる必要があります。</strong>
  </p>
  <div style="font-size:72px">🎂🎉🥳</div>
  <h2>HAPPY BIRTHDAY!</h2>
  <p>
    Kazutaka Anzai、誕生日おめでとう！！<br>
    最高の一年になりますように！
  </p>
  <div class="small">※この診断に科学的根拠は一切ありません。<br>友人による計画的な誕生日祝いです。</div>
</div>

<script>
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const messages=[
"システムを準備しています...",
"人物情報を解析中...",
"最近の行動パターンを分析中...",
"本日の重要イベントを検索中...",
"祝福対象を確認中...",
"最終診断を実行しています..."
];
let p=0;
const timer=setInterval(()=>{
  p+=1.5;
  fill.style.width=Math.min(p,100)+"%";
  status.textContent=messages[Math.min(Math.floor(p/18),messages.length-1)];
  if(p>=100){
    clearInterval(timer);
    setTimeout(()=>{
      document.getElementById("check").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
      confetti();
    },900);
  }
},45);

function confetti(){
  const symbols=["🎉","🎊","✨","🎈","★","🥳"];
  for(let i=0;i<80;i++){
    const e=document.createElement("div");
    e.className="confetti";
    e.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.fontSize=(12+Math.random()*18)+"px";
    e.style.animationDuration=(2.5+Math.random()*3)+"s";
    e.style.animationDelay=Math.random()*1.5+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),6000);
  }
}
</script>
</body>
</html>
